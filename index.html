<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ワイン推理</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-title" content="ワイン推理">
<meta name="application-name" content="ワイン推理">
<meta name="theme-color" content="#0A0A0B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Shippori+Mincho+B1:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:dark;
  --paper:#0A0A0B;--surface:#131315;--surface2:#1A1A1D;--ink:#E4E4E8;--muted:#8D8D95;--line:#2A2A2F;--line2:#3C3C43;
  --claret:#B5475C;--straw:#CDB873;--on-acc:#0A0A0B;--tint:rgba(220,220,228,.06);
  --silver:linear-gradient(180deg,#F7F7F9 0%,#CFCFD5 48%,#8F8F97 100%);
  --acc:#D6D6DB;
  --f-logo:"Cormorant Garamond","Shippori Mincho B1",Georgia,serif;
  --f-head:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic","Noto Sans JP",system-ui,sans-serif;
}
/* 黒地に銀のデザインはライト・ダークどちらの設定でも同じ */
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --paper:#0A0A0B;--surface:#131315;--surface2:#1A1A1D;--ink:#E4E4E8;--muted:#8D8D95;--line:#2A2A2F;--line2:#3C3C43;
  --claret:#B5475C;--straw:#CDB873;--on-acc:#0A0A0B;--tint:rgba(220,220,228,.06);
  --silver:linear-gradient(180deg,#F7F7F9 0%,#CFCFD5 48%,#8F8F97 100%);}}
:root[data-theme="dark"]{color-scheme:dark;
  --paper:#0A0A0B;--surface:#131315;--surface2:#1A1A1D;--ink:#E4E4E8;--muted:#8D8D95;--line:#2A2A2F;--line2:#3C3C43;
  --claret:#B5475C;--straw:#CDB873;--on-acc:#0A0A0B;--tint:rgba(220,220,228,.06);
  --silver:linear-gradient(180deg,#F7F7F9 0%,#CFCFD5 48%,#8F8F97 100%);}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;-webkit-font-smoothing:antialiased}
body.w{--acc:#D6D6DB}
.wrap{max-width:620px;margin:0 auto;padding:0 18px 48px}
header{padding:22px 0 10px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-head);font-size:22px;font-weight:700;letter-spacing:.02em;margin:0}
.brand small{display:block;font-family:var(--f-body);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0}
button{font:inherit;color:inherit;cursor:pointer}
.link{background:none;border:0;padding:6px 0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}
.link:focus-visible,.opt:focus-visible,.btn:focus-visible,select:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
h2{font-family:var(--f-head);font-weight:700;font-size:26px;line-height:1.4;margin:18px 0 10px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.start-choice{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:22px 0}
.glass{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:22px 16px 18px;text-align:left}
.glass b{display:block;font-family:var(--f-head);font-size:24px}
.glass span{font-size:13px;color:var(--muted)}
.glass .dot{width:28px;height:28px;border-radius:50%;margin-bottom:12px}
.glass.r .dot{background:#7C2035}.glass.w .dot{background:#E6C45E}
.notes{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
.notes li{margin-bottom:4px}
.resume{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;gap:10px}
/* question */
.prog{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--muted);margin-top:4px}
.bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}
.sec{display:inline-block;font-size:12px;font-weight:700;color:var(--acc);margin-top:22px}
.q{font-family:var(--f-head);font-size:23px;font-weight:700;line-height:1.45;margin:4px 0 6px}
.help{font-size:13px;color:var(--muted);margin-bottom:16px}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:48px;transition:border-color .12s}
.opt .n{flex:none;width:22px;font-size:12px;color:var(--muted);text-align:right}
.opt .lv{flex:none;display:flex;gap:2px}
.opt .lv i{width:4px;height:14px;border-radius:1px;background:var(--line)}
.opt .lv i.on{background:var(--acc)}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.unk{background:transparent;border-style:dashed;color:var(--muted);margin-top:6px}
.opt.unk.sel{color:var(--ink)}
.nav{display:flex;justify-content:space-between;margin-top:18px}
.note{font-size:13px;border-left:3px solid var(--acc);padding:6px 10px;margin:4px 0 10px;background:var(--tint);border-radius:0 8px 8px 0}
.note.warn{border-left-color:var(--claret)}
.hbtns{display:flex;gap:16px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-head);font-size:24px;line-height:1.2;color:var(--acc)}
.stat span{font-size:12px;color:var(--muted)}
.hitem{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;display:flex;gap:12px;align-items:flex-start}
.hitem .dot{flex:none;width:12px;height:12px;border-radius:50%;margin-top:7px}
.hitem .dot.w{background:#E6C45E}.hitem .dot.r{background:#7C2035}
.hitem .body{flex:1;min-width:0}
.hitem .t{font-weight:700}
.hitem .s{font-size:13px;color:var(--muted)}
.hitem .acts{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.rank{display:inline-block;font-size:12px;border-radius:999px;padding:0 8px;border:1px solid var(--line);margin-left:4px}
.rank.hit{border-color:var(--acc);color:var(--acc)}
input[type=text]{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:6px 0}
input[type=text]:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 4px}
.seg button{border:0;background:var(--surface);padding:8px 18px}
.seg button.on{background:var(--acc);color:var(--on-acc);font-weight:700}
.filters{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.filters select,.filters input{margin:0}
.filters input{grid-column:1/-1}
.libitem{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:6px 0}
.libitem b{display:block}.libitem span{font-size:13px;color:var(--muted)}
.tt{width:100%;border-collapse:collapse;font-size:14px}
.tt th{font-size:12px;color:var(--acc);text-align:left;padding:14px 0 4px;border-bottom:1px solid var(--line)}
.tt td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
.tt td:first-child{color:var(--muted);width:44%;padding-right:10px}
.tt .lvb{display:flex;gap:2px;margin-top:4px}.tt .lvb i{width:12px;height:4px;border-radius:1px;background:var(--line)}.tt .lvb i.on{background:var(--acc)}
.photo{margin-top:10px}
.photo img{display:block;max-width:100%;max-height:320px;border-radius:10px;border:1px solid var(--line);margin-bottom:6px}
.hitem .thumb{flex:none;width:44px;height:44px;object-fit:cover;border-radius:8px;background:var(--tint)}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:20}
#toast.show{opacity:1;transform:translate(-50%,0)}
button{-webkit-tap-highlight-color:transparent}
.a2hs{margin:4px 0 14px;font-size:14px}
.a2hs ol{margin:8px 0 0;padding-left:20px}.a2hs li{margin-bottom:6px}
.peek{margin-top:26px;border-top:1px solid var(--line);padding-top:12px;font-size:13px}
.peek ol{margin:6px 0 0;padding-left:20px}
/* result */
.res-head{margin-top:18px}
.cand{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px 14px;margin:12px 0}
.cand.first{border-color:var(--acc)}
.cand .top{display:flex;align-items:baseline;gap:14px}
.pct{font-family:var(--f-head);font-size:40px;font-weight:700;line-height:1;color:var(--acc);min-width:88px}
.pct small{font-size:18px}
.cname{font-family:var(--f-head);font-size:21px;font-weight:700;line-height:1.35}
.cmeta{font-size:13px;color:var(--muted)}
.pbar{height:6px;background:var(--tint);border-radius:3px;margin:12px 0 10px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--acc)}
dl{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;margin:8px 0 0;font-size:13.5px}
dt{color:var(--muted)}dd{margin:0}
.ev{font-size:13px;margin-top:10px}
.ev b{font-weight:700}
.chip{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin:2px 4px 2px 0;font-size:12.5px}
.chip.neg{border-style:dashed;color:var(--muted)}
.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:14px 0;font-size:14px}
.box h3{font-size:15px;margin:0 0 8px}
.box ul{margin:0;padding-left:18px}.box li{margin-bottom:6px}
.others{font-size:14px}
.others li{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0}
.others ol{list-style:none;margin:0;padding:0}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.btn{border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);border-radius:10px;padding:10px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
select{font:inherit;width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);margin:6px 0}
details{margin-top:12px;font-size:13.5px}
details summary{cursor:pointer;color:var(--muted)}
.ans{display:grid;grid-template-columns:1fr auto;gap:2px 10px;margin-top:8px}
.ans span:nth-child(even){color:var(--muted);text-align:right}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ===== Noir & Argent ===== */
body{background:radial-gradient(120% 60% at 50% -10%,#1C1C20 0%,var(--paper) 60%) fixed,var(--paper);letter-spacing:.01em}
.silver,h2,.q,.pct,.cname,.glass b,.stat b,.wm{background:var(--silver);-webkit-background-clip:text;background-clip:text;color:transparent}
header{align-items:center;flex-wrap:wrap;row-gap:4px;padding:20px 0 14px;border-bottom:1px solid var(--line);margin-bottom:6px}
.wm{white-space:nowrap}.wm small{white-space:nowrap}
.hbtns{margin-left:auto}
.brand{display:flex;align-items:center;gap:12px;font-weight:600;min-width:0}
.hbtns{flex:none}.hbtns .link{white-space:nowrap}
.brand .emb{width:42px;height:42px;flex:none}
.wm{font-family:var(--f-logo);font-size:21px;font-weight:600;letter-spacing:.24em;line-height:1.1}
.wm small{display:block;font-family:var(--f-body);font-size:10.5px;font-weight:500;letter-spacing:.18em;margin-top:4px;background:none;-webkit-background-clip:border-box;background-clip:border-box;color:var(--muted)}
h2{font-weight:700;letter-spacing:.03em}
.link{color:var(--muted);text-decoration-color:var(--line2)}
.link:hover{color:var(--ink)}
.glass,.resume,.cand,.box,.stat,.hitem,.libitem,.opt{background:linear-gradient(180deg,var(--surface2),var(--surface));border-color:var(--line)}
.glass{position:relative;overflow:hidden}
.glass::after{content:"";position:absolute;inset:0 0 auto;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent)}
.glass .dot,.hitem .dot{box-shadow:0 0 0 1px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.35)}
.glass.r .dot,.hitem .dot.r{background:#6E1D30}.glass.w .dot,.hitem .dot.w{background:#C9B36A}
.glass:hover,.opt:hover,.libitem:hover{border-color:var(--line2)}
.opt{color:var(--ink)}
.opt.sel{border-color:#CFCFD5;box-shadow:0 0 0 1px #CFCFD5,0 0 18px rgba(220,220,228,.12);background:linear-gradient(180deg,#202024,#17171A)}
.opt.unk{background:transparent;border-color:var(--line2)}
.opt .lv i{background:var(--line2)}.opt .lv i.on,.tt .lvb i.on{background:var(--silver)}
.bar{background:var(--line)}.bar i,.pbar i{background:var(--silver)}
.pbar{background:var(--tint)}
.sec,.tt th{color:var(--muted);letter-spacing:.2em;font-size:11px;text-transform:uppercase}
.cand.first{border-color:#9A9AA2;box-shadow:0 0 0 1px rgba(207,207,213,.25),0 10px 30px rgba(0,0,0,.45)}
.btn{background:var(--silver);color:var(--on-acc);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 2px 10px rgba(0,0,0,.4);letter-spacing:.05em}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);box-shadow:none}
.chip{border-color:var(--line2);color:var(--ink)}.chip.neg{color:var(--muted)}
.rank{border-color:var(--line2)}.rank.hit{border-color:#CFCFD5;color:var(--ink)}
.seg{border-color:var(--line2)}.seg button{background:var(--surface);color:var(--muted)}.seg button.on{background:var(--silver);color:var(--on-acc)}
select,input[type=text]{background:var(--surface);border-color:var(--line2);color:var(--ink)}
.note{background:var(--surface);border-left-color:#CFCFD5}.note.warn{border-left-color:var(--claret)}
#toast{background:var(--silver);color:var(--on-acc)}
.notes{border-top-color:var(--line)}
details summary{color:var(--muted)}
.link:focus-visible,.opt:focus-visible,.btn:focus-visible,select:focus-visible,input:focus-visible,.glass:focus-visible,.libitem:focus-visible{outline:2px solid #CFCFD5;outline-offset:2px}
@media (max-width:380px){.wm{font-size:18px;letter-spacing:.18em}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="brand"><svg class="emb" aria-hidden="true" viewBox="0 0 512 512" width="40" height="40" xmlns="http://www.w3.org/2000/svg"><defs> <linearGradient id="mhd" gradientUnits="userSpaceOnUse" x1="60" y1="40" x2="420" y2="470"><stop offset="0" stop-color="#FFFFFF"/><stop offset="0.18" stop-color="#B9BDC4"/><stop offset="0.36" stop-color="#F4F5F7"/><stop offset="0.55" stop-color="#5F636B"/><stop offset="0.72" stop-color="#DCDEE2"/><stop offset="0.9" stop-color="#80848C"/><stop offset="1" stop-color="#EEEFF1"/></linearGradient> <linearGradient id="whd" gradientUnits="userSpaceOnUse" x1="0" y1="160" x2="0" y2="250"><stop offset="0" stop-color="#7A1830"/><stop offset=".55" stop-color="#3E0814"/><stop offset="1" stop-color="#1E030A"/></linearGradient> <filter id="bvhd" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">  <feGaussianBlur in="SourceAlpha" stdDeviation="3.2" result="b"/>  <feDiffuseLighting in="b" surfaceScale="6" diffuseConstant="1.05" lighting-color="#fff" result="d"><feDistantLight azimuth="225" elevation="52"/></feDiffuseLighting>  <feComposite in="SourceGraphic" in2="d" operator="arithmetic" k1="1.15" k2="0" k3="0" k4="0" result="lit"/>  <feSpecularLighting in="b" surfaceScale="6" specularConstant="1.25" specularExponent="34" lighting-color="#fff" result="s"><feDistantLight azimuth="225" elevation="40"/></feSpecularLighting>  <feComposite in="s" in2="SourceAlpha" operator="in" result="sIn"/>  <feComposite in="lit" in2="sIn" operator="arithmetic" k1="0" k2="1" k3=".85" k4="0" result="out"/>  <feComposite in="out" in2="SourceAlpha" operator="in"/> </filter> <filter id="shhd" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".7"/></filter></defs><g filter="url(#shhd)"> <path d="M155 172 H277 C273 218 251 246 216 246 C181 246 159 218 155 172 Z" fill="url(#whd)"/><path d="M161 176 H271" stroke="#C94A64" stroke-width="3" opacity=".55"/> <g filter="url(#bvhd)" fill="none" stroke="url(#mhd)" stroke-linecap="round" stroke-linejoin="round">  <circle cx="216" cy="216" r="158" stroke-width="26"/>  <circle cx="216" cy="216" r="129" stroke-width="5"/>  <path d="M332 332 L446 446" stroke-width="46"/>  <path d="M146 120 H286 C286 200 258 254 216 254 C174 254 146 200 146 120 Z" stroke-width="12"/>  <path d="M216 254 V318" stroke-width="12"/>  <path d="M176 322 H256" stroke-width="12"/> </g> <path d="M80 150 A158 158 0 0 1 150 74" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" opacity=".55"/></g></svg><span class="wm">DEDUCTION<small>ワイン推理ナビ</small></span></p>
    <div class="hbtns"><button class="link" id="libBtn">逆引き</button><button class="link" id="histBtn">履歴</button><button class="link" id="home" hidden>最初に戻る</button></div>
  </header>
  <main id="app"></main>
</div>
<script>
/* ===== 問い（Carnet-du-Vin の尺度に準拠） ===== */
const PRES = ['感じない','少し感じる','はっきり感じる'];
const pr = (k,q,h,x={}) => ({k,s:'香り',t:'o',q,h,o:PRES,sd:.75,neg:.35,...x});
const QS = {
 w: [
  {k:'hue',s:'外観',t:'o',q:'メインの色調は？',h:'白い紙の上でグラスを傾け、中心の色を見ます。',o:['レモンイエロー','イエロー','黄金色','トパーズ・それより濃い']},
  {k:'tint',s:'外観',t:'c',q:'縁に見える補助的な色合いは？',h:'グラスの縁、液面の端を見ます。',o:[['silver','シルバーがかった'],['green','グリーンがかった'],['gold','黄金色がかった'],['none','どれもはっきりしない']],w:.6},
  {k:'depth',s:'外観',t:'o',q:'濃淡は？',h:'',o:['無色に近い','淡い','やや濃い','濃い','非常に濃い']},
  {k:'visc',s:'外観',t:'o',q:'粘性は？',h:'グラスを回したあと、脚（涙）の太さと落ちる速さを見ます。',o:['さらっとした','適度な','やや強い','ねっとりとした']},
  {k:'young',s:'外観',t:'o',q:'外観の印象（若さ）は？',h:'',o:['若々しい','やや発展した','熟成のニュアンスが見える','熟成した'],w:.6},
  {k:'nose',s:'香り',t:'o',q:'香りの第一印象（強さ）は？',h:'グラスを回す前に一度、回してからもう一度嗅ぎます。',o:['閉じている','控えめ','開いている','力強い']},
  {k:'fruit',s:'香り',t:'o',q:'中心にある果実の熟度は？',h:'一番はっきりした果実を選びます（練習帳の熟度の並び）。',o:['柑橘類・青リンゴ','リンゴ・洋梨','白桃・アプリコット','パイナップル・マンゴー・パッションフルーツ']},
  pr('flower','白い花（スイカズラ・アカシア・菩提樹など）は？',''),
  pr('herb','ハーブ・青草・ミントなど青い香りは？','ヴェルヴェーヌ、タイム、芽のような青さも含めます。'),
  pr('mineral','ミネラル（石灰・貝殻・鉱物・海の香り）は？',''),

/* ===== 確率の計算 ===== */
const EPS=.06, TEMP=.85;
function lik(q,cand,a){
  if(a==null||a==='u') return 1;
  if(q.t==='o'){

    const sd=q.sd||.9, i=+a;
    let L=EPS+Math.exp(-((i-mu)**2)/(2*sd*sd));
    if(q.neg && i===0) L=(1-q.neg)*L+q.neg*.6;   // 「感じない」は弱い証拠として扱う
    return L;
  }
  const d=cand.p[q.k]||{}; const keys=q.o.map(x=>x[0]);
  const vals=keys.map(k=>(d[k]||0)+.08); const sum=vals.reduce((s,x)=>s+x,0);

}
// 選択肢全体で正規化した「その候補ならこう答える確率」
function pAns(q,c,a){const vs=optVals(q).map(v=>lik(q,c,v)); const s=vs.reduce((x,y)=>x+y,0); return lik(q,c,a)/s;}

function scores(color,ans,wmap={}){
  return CANDS.filter(c=>c.c===color).map(c=>{
    let s=Math.log(c.prior); const contrib={};
    answered(ans).forEach(k=>{const q=QK(color,k); if(!q) return; const v=(q.w||.85)*(wmap[k]??1)*Math.log(lik(q,c,ans[k])); contrib[k]=v; s+=v;});

}
function softmax(xs,T){const m=Math.max(...xs.map(x=>x/T)); const e=xs.map(x=>Math.exp(x/T-m)); const t=e.reduce((a,b)=>a+b,0); return e.map(x=>x/t);}

function consistency(color,ans){
  const rows=scores(color,ans), out={};
  answered(ans).forEach(k=>{
    const q=QK(color,k); if(!q) return;
    const p=softmax(rows.map(r=>r.s-(r.contrib[k]||0)),TEMP);
    const P={}; optVals(q).forEach(v=>{P[v]=rows.reduce((t,r,i)=>t+p[i]*pAns(q,r.c,v),0);});
    const best=optVals(q).reduce((a,b)=>P[b]>P[a]?b:a);

/* 当てはまり度：その候補の典型的な答え方にどれだけ近いか（0〜1） */

    let eh=0;
    optVals(q).forEach(v=>{
      const lk=A.rows.map(r=>pAns(q,r.c,v)); const po=lk.reduce((t,l,i)=>t+l*p[i],0); if(po<=0) return;

function GROUPS(color){

  return [...m.entries()].sort((a,b)=>a[0].localeCompare(b[0],'ja')).map(([g,set])=>[g,[...set].sort((a,b)=>a.localeCompare(b,'ja'))]);
}
function renderResult(){
  const color=S.color, A=analyze(color,S.ans), rows=A.rows;
  const top=rows.slice(0,3), rest=1-top.reduce((s,r)=>s+r.pr,0);
  const asked=S.hist.map(h=>h.k).filter((k,i,arr)=>arr.indexOf(k)===i);
  const nAns=answered(S.ans).length;
  const card=(r,idx)=>{
    const pos=r.rel.filter(x=>x.d>.15).slice(0,4), neg=r.rel.slice().reverse().filter(x=>x.d<-.4).slice(0,2);
    const chip=(x,cls)=>{const q=QK(color,x.k); return `<span class="chip${cls}">${esc(qtext(q))}：${esc(label(q,S.ans[x.k]))}</span>`;};
    return `<article class="cand${idx===0?' first':''}">
      <div class="top"><div class="pct">${pct(r.pr)}<small>%</small></div>
        <div><div class="cname">${esc(r.c.name)}</div><div class="cmeta">${esc(r.c.grape)}｜${esc(r.c.country)}</div></div></div>
      <div class="pbar"><i style="width:${Math.max(1,r.pr*100)}%"></i></div>
      <dl><dt>品種</dt><dd>${esc(r.c.grape)}</dd><dt>国</dt><dd>${esc(r.c.country)}</dd>
        <dt>産地</dt><dd><b>${esc(r.c.region)}</b>${r.c.alt?`<span class="muted">（ほかに ${esc(r.c.alt)}）</span>`:''}</dd>
        ${r.c.ex?`<dt>出題例</dt><dd>${esc(r.c.ex)}</dd>`:''}</dl>
      ${pos.length?`<div class="ev"><b>合っている回答</b><br>${pos.map(x=>chip(x,'')).join('')}</div>`:''}
      ${neg.length?`<div class="ev"><b>合わない回答</b><br>${neg.map(x=>chip(x,' neg')).join('')}</div>`:''}
    </article>`;
  };
  const lvl = A.flagged.length===0?'高い':A.flagged.length<=2?'ふつう':'低い';
  if(!S.sid){S.sid='h'+Date.now(); S.at=Date.now();}
  hUpsert({id:S.sid,at:S.at,color,ans:S.ans,hist:S.hist,top:top.map(r=>({id:r.c.id,name:r.c.name,pr:r.pr})),integ:lvl});

  const saved=hLoad().find(x=>x.id===S.sid)||{};
  const integ = `<section class="box"><h3>回答の整合性：${lvl}</h3>${A.flagged.length?`<p class="muted" style="margin:0 0 8px">次の回答はほかの回答と食い違っていたため、影響を小さくして計算しました。食い違いが多いほど、％は控えめに出ます。</p><ul>${A.flagged.map(f=>{const q=QK(color,f.k); return `<li><b>${esc(qtext(q))}</b>：あなたの回答「${esc(label(q,S.ans[f.k]))}」、ほかの回答からの予想「${esc(label(q,f.exp))}」（影響を${f.f<.5?'大きく':''}減らしました）</li>`;}).join('')}</ul>`:`<p class="muted" style="margin:0">回答どうしに大きな食い違いはありませんでした。</p>`}</section>`;
  const sp=[...splitters(top[0].c,top[1].c,color).slice(0,2),...splitters(top[0].c,top[2].c,color).slice(0,2)];
  const all=CANDS.filter(c=>c.c===color);
  const kindOf=k=>S.hist.find(h=>h.k===k&&h.kind!=='rc')?.kind;
  app.innerHTML=`
   <div class="res-head"><h2>候補は、この3つです。</h2>
   <p class="muted">${asked.length}問中${nAns}問の回答から計算しました。％は候補リスト（${color==='w'?'白':'赤'}${all.length}種）全体の中での相対的な可能性で、上位3つの合計は${pct(1-rest)}%です。</p></div>
   ${top[0].pr<.3?`<div class="note warn">どの候補にもはっきりとは当てはまりませんでした。候補リスト（${color==='w'?'白':'赤'}${all.length}種）にないワインの可能性もあります。リストは1万円未満で大会や2次試験に出やすいワインに絞っているため、マイナーな品種や甘口・熟成したワインは入っていません。</div>`:''}
   ${top.map(card).join('')}
   ${integ}
   ${sp.length?`<section class="box"><h3>もう一度確かめると差がつくところ</h3><ul>${sp.map(x=>`<li><b>${esc(qtext(x.q))}</b>：${x.txt}</li>`).join('')}</ul></section>`:''}
   <section class="box others"><h3>4位以下</h3><ol>${rows.slice(3,8).map(r=>`<li><span>${esc(r.c.name)}</span><span class="muted">${pct(r.pr)}%</span></li>`).join('')}</ol></section>
   <section class="box"><h3>答え合わせ</h3>

     <label class="muted" for="tG" style="font-size:13px">1. 品種 × 国</label>
     <select id="tG"><option value="">選ぶ</option>${GROUPS(color).map(([g,arr])=>`<optgroup label="${esc(g)}">${arr.map(co=>`<option value="${esc(g+'|'+co)}">${esc(g)} × ${esc(co)}</option>`).join('')}</optgroup>`).join('')}<option value="other">リストにないワイン</option></select>
     <div id="tRest"></div>
     <div id="truthOut" aria-live="polite"></div>
     <label class="muted" for="memo" style="font-size:13px">メモ（ワイン名・生産者・ヴィンテージなど）</label>
     <input type="text" id="memo" value="${esc(saved.memo||'')}" placeholder="例：ドイツ ミュラー・トゥルガウ トロッケン 2023">
     <div class="photo" id="photoBox"><button class="btn ghost" id="photoBtn">ラベル写真を添付</button></div></section>
   <details><summary>自分の回答を見る</summary><div class="ans">${asked.map(k=>{const q=QK(color,k); return `<span>${kindOf(k)==='fu'?'［追加］':''}${esc(q.q)}</span><span>${esc(S.ans[k]==null?'未回答':label(q,S.ans[k]))}</span>`;}).join('')}</div></details>

  const ALIAS={rioja:'rioja-crianza'};

    if(!tp.g){rest.innerHTML='';out.textContent=''; if(store) hUpsert({id:S.sid,tp:null,truth:null,truthName:null,rank:null}); return;}
    if(tp.g==='other'){rest.innerHTML='';out.innerHTML='<p class="muted" style="margin:10px 0 0">リストにないワインとして記録しました。ワイン名はメモに残せます。</p>'; if(store) hUpsert({id:S.sid,tp,truth:'other',truthName:'リストにないワイン',rank:null}); return;}
    const [g,co]=tp.g.split('|'); const grp=all.filter(c=>c.g===g&&c.country===co);
    if(!grp.length){rest.innerHTML='';out.innerHTML='<p class="muted" style="margin:10px 0 0">候補リストの更新で見つからなくなりました。選び直してください。</p>';return;}
    let html='', set=grp; const steps=[{t:`品種×国（${g} × ${co}）`,r:bestIn(grp)}];
    const broads=[...new Set(grp.flatMap(c=>c.tree.map(t=>t.b)))];
    if(tp.b&&tp.b!=='?'&&!broads.includes(tp.b)) tp={g:tp.g};
    if(tp.a&&tp.a!=='?'&&!grp.some(c=>c.tree.some(t=>t.b===tp.b&&t.a.includes(tp.a)))) tp={g:tp.g,b:tp.b};
    html+=`<label class="muted" for="tB" style="font-size:13px">2. 産地（広域）</label><select id="tB"><option value="">選ぶ</option>${broads.map(x=>opt(x,x,tp.b)).join('')}${opt('?','わからない・リストにない産地',tp.b)}</select>`;
    if(tp.b&&tp.b!=='?'){
      set=grp.filter(c=>c.tree.some(t=>t.b===tp.b)); steps.push({t:`産地（${tp.b}）`,r:bestIn(set)});
      const apps=[...new Set(set.flatMap(c=>c.tree.filter(t=>t.b===tp.b).flatMap(t=>t.a)))];
      html+=`<label class="muted" for="tA" style="font-size:13px">3. アペラシオン・地区</label><select id="tA"><option value="">選ぶ</option>${apps.map(x=>opt(x,x,tp.a)).join('')}${opt('?','わからない・リストにないアペラシオン',tp.a)}</select>`;
      if(tp.a&&tp.a!=='?'){ set=set.filter(c=>c.tree.some(t=>t.b===tp.b&&t.a.includes(tp.a))); steps.push({t:`アペラシオン（${tp.a}）`,r:bestIn(set)}); }
    }
    const ready=tp.b==='?'||(tp.b&&tp.a);
    if(ready&&set.length>1){

    }
    if(tp.id&&!set.some(c=>c.id===tp.id)) tp.id=null;
    if(tp.id) set=set.filter(c=>c.id===tp.id);
    const fin=ready&&set.length===1?set[0]:null;
    if(fin&&tp.id) steps.push({t:`スタイル（${fin.name}）`,r:rankOf(fin.id)});
    rest.innerHTML=html;
    const rank=steps[steps.length-1].r;
    const tgt=fin||set.slice().sort((x,y)=>rankOf(x.id)-rankOf(y.id))[0];
    const r=rows[rankOf(tgt.id)-1];
    const miss=ready&&r?r.rel.slice().reverse().filter(x=>x.d<-.3).slice(0,3).map(x=>{const q=QK(color,x.k); return `<li>${esc(qtext(q))}：あなたは「${esc(label(q,S.ans[q.k]))}」、典型的には「${esc(typical(q,r.c))}」</li>`;}):[];
    out.innerHTML=`<ul style="margin:10px 0 6px">${steps.map(x=>`<li>${esc(x.t)}：<b>${x.r?x.r+'位':'—'}</b></li>`).join('')}</ul><p class="muted" style="margin:0 0 6px;font-size:13px">各段階で、当てはまる候補のうち最も上位だった順位です。</p>${miss.length?`<p class="muted" style="margin:0">典型的な特徴とずれた回答（${esc(r.c.name)}）</p><ul>${miss.join('')}</ul>`:''}`;
    const tname=[`${g}×${co}`,tp.b&&tp.b!=='?'?tp.b:null,tp.a&&tp.a!=='?'?tp.a:null].filter(Boolean).join('｜')+(fin&&tp.id?`（${fin.name}）`:'');
    if(store) hUpsert({id:S.sid,tp,truth:fin?fin.id:null,truthName:tname,rank,truthPr:fin?r.pr:null});
    const tB=document.getElementById('tB'); if(tB) tB.onchange=e=>{tp={g:tp.g,b:e.target.value||undefined}; drawTruth(true);};
    const tA=document.getElementById('tA'); if(tA) tA.onchange=e=>{tp={g:tp.g,b:tp.b,a:e.target.value||undefined}; drawTruth(true);};
    const tS=document.getElementById('tS'); if(tS) tS.onchange=e=>{tp.id=e.target.value||null; drawTruth(true);};
  };
  document.getElementById('tG').onchange=e=>{tp={g:e.target.value||undefined}; drawTruth(true);};
  drawTruth(false);
  document.getElementById('memo').onchange=e=>hUpsert({id:S.sid,memo:e.target.value.trim()});
  const bh=document.getElementById('backHist'); if(bh) bh.onclick=openHistory;
  document.getElementById('again').onclick=()=>{S=fresh();save();render();};
  document.getElementById('shareBtn').onclick=()=>{
    const e=hLoad().find(x=>x.id===S.sid)||{};
    const head=e.memo?`${e.memo}\n`:'';
    const truth=e.rank?`\n正解（${e.truthName}）は${e.rank}位でした。`:'';
    shareText('Deduction ワイン推理ナビ',`${head}Deduction ワイン推理ナビの推理（${color==='w'?'白':'赤'}・回答の整合性 ${lvl}）\n${top.map((r,i)=>`${i+1}. ${r.c.name}（${r.c.region}）${pct(r.pr)}%`).join('\n')}${truth}`);
  };
  const showPhoto=src=>{ const box=document.getElementById('photoBox'); if(!box) return;
    box.innerHTML=src?`<img src="${src}" alt="ラベル写真"><div><button class="link" id="photoChg">撮り直す</button>　<button class="link" id="photoDel">写真を外す</button></div>`:'<button class="btn ghost" id="photoBtn">ラベル写真を添付</button>';
    const add=async()=>{ const d=await pickPhoto(); if(!d) return; KV.set(PHOTO(S.sid),d); hUpsert({id:S.sid,photo:true}); showPhoto(d); };
    const pb=document.getElementById('photoBtn'); if(pb) pb.onclick=add;
    const pc=document.getElementById('photoChg'); if(pc) pc.onclick=add;
    const pd=document.getElementById('photoDel'); if(pd) pd.onclick=()=>{ KV.remove(PHOTO(S.sid)); hUpsert({id:S.sid,photo:false}); showPhoto(null); };
  };
  showPhoto(null); if(saved.photo) KV.getAsync(PHOTO(S.sid)).then(d=>{ if(d) showPhoto(d); });
  document.getElementById('edit').onclick=()=>{S.view='q';S.pos=0;save();render();};
}

async function exportBackup(){
  const l=hLoad(), photos={};
  for(const e of l){ if(e.photo){ const d=await KV.getAsync(PHOTO(e.id)); if(d) photos[e.id]=d; } }
  const json=JSON.stringify({app:'Deduction',v:1,at:Date.now(),history:l,photos});
  const name=`deduction-backup-${new Date().toISOString().slice(0,10)}.json`;
  try{
    if(FS&&ShareP){ const w=await FS.writeFile({path:name,data:json,directory:'CACHE',encoding:'utf8'}); await ShareP.share({title:'Deduction のバックアップ',files:[w.uri],dialogTitle:'バックアップの保存先'}); return; }
    const file=new File([json],name,{type:'application/json'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Deduction のバックアップ'}); return; }
    const a=document.createElement('a'); a.href=URL.createObjectURL(file); a.download=name; document.body.appendChild(a); a.click(); a.remove();
    toast('バックアップを書き出しました');
  }catch(e){ if(!(e&&e.name==='AbortError')) toast('書き出せませんでした'); }
}
function importBackup(){
  const i=document.createElement('input'); i.type='file'; i.accept='application/json,.json';
  i.onchange=()=>{ const f=i.files&&i.files[0]; if(!f) return; const fr=new FileReader();
    fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d||!Array.isArray(d.history)) throw 0;
        const cur=hLoad(), ids=new Set(cur.map(x=>x.id)); let n=0;
        d.history.forEach(e=>{ if(e&&e.id&&!ids.has(e.id)){ cur.push(e); n++; } });
        cur.sort((a,b)=>(b.at||0)-(a.at||0)); hSave(cur);
        Object.entries(d.photos||{}).forEach(([id,v])=>{ if(typeof v==='string'&&v.startsWith('data:image/')) KV.set(PHOTO(id),v); });
        toast(`${n}件の記録を読み込みました`); render();
      }catch(e){ toast('このファイルは読み込めませんでした'); } };
    fr.readAsText(f); };
  i.click();
}

function openLib(o={}){ if(S.view==='q'||S.view==='res') save(); const c=o.color||S.color||'r'; S={...fresh(),view:'lib',lib:{color:c,country:'',grape:'',text:'',id:null,...o}}; render(); }
function typLabel(q,c){
  const v=c.p[q.k];
  if(q.t==='o'){ if(v==null) return '—'; const n=q.o.length, x=clamp(v,0,n-1), lo=Math.floor(x), hi=Math.min(n-1,lo+1), f=x-lo;
    return f<.3?q.o[lo]:f>.7?q.o[hi]:`${q.o[lo]}〜${q.o[hi]}`; }
  const d=v||{}; const srt=q.o.slice().sort((a,b)=>(d[b[0]]||0)-(d[a[0]]||0)); const a=d[srt[0][0]]||0, b=d[srt[1][0]]||0;
  if(!a) return '特徴なし'; return b>=a*.6?`${srt[0][1]}／${srt[1][1]}`:srt[0][1];
}
function dist(a,b,color){
  let t=0; ALLQ[color].forEach(q=>{ if(q.t==='o'){const x=a.p[q.k],y=b.p[q.k]; if(x!=null&&y!=null) t+=((x-y)/(q.o.length-1))**2;}
    else {const da=a.p[q.k]||{},db=b.p[q.k]||{}; const sa=q.o.reduce((s,o)=>s+(da[o[0]]||0),0)||1, sb=q.o.reduce((s,o)=>s+(db[o[0]]||0),0)||1; t+=.25*q.o.reduce((s,o)=>s+Math.abs((da[o[0]]||0)/sa-(db[o[0]]||0)/sb),0)**2;}});
  return Math.sqrt(t);
}
function renderLib(){
  const L=S.lib, color=L.color;
  if(L.id){
    const c=CANDS.find(x=>x.id===L.id);
    const secs=[['外観',QS[color].filter(q=>q.s==='外観')],['香り',QS[color].filter(q=>q.s==='香り')],['味わい',QS[color].filter(q=>q.s==='味わい'||q.s==='総合')],['追加の質問で使う特徴',FU[color]]];
    const row=q=>{const n=q.o.length, v=c.p[q.k]; const bar=q.t==='o'&&v!=null&&q.o!==YN&&n>2?`<div class="lvb" aria-hidden="true">${Array.from({length:n},(_,j)=>`<i class="${j<=Math.round(v)?'on':''}"></i>`).join('')}</div>`:'';
      return `<tr><td>${esc(qtext(q))}</td><td>${esc(typLabel(q,c))}${bar}</td></tr>`;};
    const near=CANDS.filter(x=>x.c===color&&x.id!==c.id).map(x=>({x,d:dist(c,x,color)})).sort((a,b)=>a.d-b.d).slice(0,3);
    app.innerHTML=`
     <p style="margin-top:14px"><button class="link" id="libBack">一覧に戻る</button></p>
     <h2 style="margin-top:4px">${esc(c.name)}</h2>
     <dl><dt>品種</dt><dd>${esc(c.grape)}</dd><dt>国</dt><dd>${esc(c.country)}</dd>
       <dt>産地</dt><dd>${c.tree.map(t=>`<b>${esc(t.b)}</b>：${esc(t.a.join('、'))}`).join('<br>')}</dd>
       ${c.ex?`<dt>出題例</dt><dd>${esc(c.ex)}</dd>`:''}</dl>
     <p class="muted" style="font-size:13px;margin-top:10px">このワインを典型的なスタイルで飲んだときに、推理ナビの各問いでどう答えるかの目安です。「A〜B」はその間くらい、「A／B」はどちらもあり得ることを表します。</p>
     <table class="tt">${secs.map(([t,qs])=>`<tr><th colspan="2">${t}</th></tr>${qs.map(row).join('')}`).join('')}</table>
     <section class="box"><h3>似ているワインとの見分け方</h3><ul>${near.map(({x})=>{const sp=splitters(c,x,color).slice(0,2);
        return `<li><button class="link" data-go="${x.id}" style="padding:0">${esc(x.name)}</button>${sp.length?`：${sp.map(z=>`<b>${esc(qtext(z.q))}</b>は${z.txt}`).join('。')}`:''}</li>`;}).join('')}</ul></section>`;
    document.getElementById('libBack').onclick=()=>{S.lib.id=null;render();};
    app.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.lib.id=b.dataset.go;render();});
    return;
  }
  const pool=CANDS.filter(x=>x.c===color);
  const countries=[...new Set(pool.map(x=>x.country))];
  const grapes=[...new Set(pool.filter(x=>!L.country||x.country===L.country).map(x=>x.grape))].sort((a,b)=>a.localeCompare(b,'ja'));
  const t=(L.text||'').trim();
  const list=pool.filter(x=>(!L.country||x.country===L.country)&&(!L.grape||x.grape===L.grape)&&(!t||[x.name,x.grape,x.region,x.alt,x.country].join(' ').includes(t)));
  app.innerHTML=`
   <h2>逆引き</h2>
   <p class="muted">品種や産地を選ぶと、そのワインの典型的な回答を確認できます。</p>
   <div class="seg" role="group" aria-label="色"><button data-col="w" class="${color==='w'?'on':''}">白</button><button data-col="r" class="${color==='r'?'on':''}">赤</button></div>
   <div class="filters">
     <select id="fCountry" aria-label="国"><option value="">すべての国</option>${countries.map(x=>`<option${x===L.country?' selected':''}>${esc(x)}</option>`).join('')}</select>
     <select id="fGrape" aria-label="品種"><option value="">すべての品種</option>${grapes.map(x=>`<option${x===L.grape?' selected':''}>${esc(x)}</option>`).join('')}</select>
     <input type="text" id="fText" placeholder="名前・産地で絞り込む（例：シャブリ、オタゴ）" value="${esc(L.text||'')}">
   </div>
   <p class="muted" style="font-size:13px;margin:10px 0 0">${list.length}件</p>
   ${list.map(x=>`<button class="libitem" data-id="${x.id}"><b>${esc(x.name)}</b><span>${esc(x.grape)}｜${esc(x.country)}｜${esc(x.region)}</span></button>`).join('')||'<p>当てはまるワインがありません。</p>'}`;
  app.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{S.lib={color:b.dataset.col,country:'',grape:'',text:'',id:null};render();});
  document.getElementById('fCountry').onchange=e=>{L.country=e.target.value;L.grape='';render();};
  document.getElementById('fGrape').onchange=e=>{L.grape=e.target.value;render();};
  const ft=document.getElementById('fText'); ft.oninput=e=>{L.text=e.target.value; const pos=e.target.selectionStart; render(); const n=document.getElementById('fText'); n.focus(); n.setSelectionRange(pos,pos);};
  app.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{L.id=b.dataset.id;render();});
}
libBtn.onclick=()=>openLib();
homeBtn.onclick=()=>{ if(S.view==='hist'||S.view==='lib'){S=fresh();} else {S.view='start';save();} render(); };
KV.init([KEY,HKEY]).then(render);
</script>
</body>
</html>
